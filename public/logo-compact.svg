<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <!-- Kernel Space Symbol: Central Core with Multi-Perspective Nodes -->
  <!-- Outer Orbit / Connection Lines -->
  <line x1="20" y1="20" x2="20" y2="7" stroke="#C6A15B" stroke-width="1.75" stroke-linecap="round" stroke-dasharray="0.5 3.5"/>
  <line x1="20" y1="20" x2="32.5" y2="12.5" stroke="#C6A15B" stroke-width="1.75" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="20" y1="20" x2="31" y2="29" stroke="#C6A15B" stroke-width="1.75" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="20" y1="20" x2="9" y2="29" stroke="#C6A15B" stroke-width="1.75" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="20" y1="20" x2="7.5" y2="12.5" stroke="#C6A15B" stroke-width="1.75" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Orbital Ring Accent -->
  <circle cx="20" cy="20" r="14.5" stroke="#E8E1D2" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Central Core (Kernel) -->
  <circle cx="20" cy="20" r="5.5" fill="#C6A15B"/>
  <circle cx="20" cy="20" r="2.2" fill="#FFFFFF"/>

  <!-- Satellite Perspective Nodes -->
  <circle cx="20" cy="7" r="3" fill="#A9843E"/>
  <circle cx="32.5" cy="12.5" r="2.5" fill="#C6A15B"/>
  <circle cx="31" cy="29" r="3.2" fill="#242321"/>
  <circle cx="9" cy="29" r="2.6" fill="#C6A15B"/>
  <circle cx="7.5" cy="12.5" r="3" fill="#A9843E"/>
</svg>
